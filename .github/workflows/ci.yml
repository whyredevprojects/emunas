name: ci

# integration-plan §3.5: typecheck (pipeline + sites) → lint → unit tests → corpus:build on
# the real data → guard pre-pass → rebuild with the suppress list → the three app builds →
# guard post-pass (layer-aware) → budgets → PR preview uploads (staging Workers, `pr-<n>` alias).
# The build steps run in the order of `npm run site:chain` (tests/chain/site-chain.ts, corpus-wave-
# plan §6); tests/chain/site-chain.test.ts fails when this file and the script disagree, and the
# chain's planted self-tests (an asrVariants key, an ASR synonym) must fail guard post.
# The e2e job (W5.1, C3.8) builds both sites from the real data again for the browser gates:
# Playwright (Chromium + WebKit, desktop + mobile, JS off for Quiet; the corpus pages of both sites
# and Live's first-load request gate), axe on every route type, cross-site equivalence (incl. topic,
# concept and story) and link checks, html-validate, the search eval regression gate and Lighthouse
# budgets.

on:
  pull_request:
  # Lets a merge queue on main run this workflow on the queued commit (and record its marker).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.4
  WRANGLER_VERSION: 4.156.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Typecheck (pipeline, unchanged)
        run: npm run typecheck
      # site:typecheck and site:test also cover the site Workers (site:*:workers) and the Live
      # search eval suite (site:*:eval), so those have no steps of their own.
      - name: Typecheck (sites, site Workers, eval suite)
        run: npm run site:typecheck
      - name: Lint
        run: npm run site:lint
      - name: Unit tests (sites, site Workers, eval suite)
        run: npm run site:test
      - name: Chain script (typecheck, lint, unit tests; the order below must match it)
        run: |
          npx tsc --noEmit -p tests/chain/tsconfig.json
          npx eslint --config packages/config/eslint.config.js --max-warnings 0 tests/chain
          npx vitest run --config tests/chain/vitest.config.ts

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Amendment A1: audio URLs and CSP media-src come from this build variable. PR builds
      # fall back to a placeholder host when the repository variable is not set.
      EMUNAS_MEDIA_ORIGIN: ${{ vars.EMUNAS_MEDIA_ORIGIN || 'https://media.example.invalid' }}
    steps:
      # The transcript folder is in git; only the guard steps below read it (from its default path).
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Corpus build
        run: npm run corpus:build
      - name: Guard pre-pass (verbatim suppress list, ids only)
        run: >-
          npm run guard --workspace=@emunas/corpus-guard --
          pre --corpus .corpus --out .corpus/suppress.json
      - name: Corpus rebuild with suppress list
        run: npm run corpus:build -- --suppress .corpus/suppress.json
      # The same data steps as deploy.yml, so a PR that breaks them fails here and not on main.
      # Both write only under .corpus/ and apps/live/public/data, which the post-pass scans.
      - name: Search documents and moments (.corpus/search, read by Quiet search and search:sync)
        run: npm run search:build
      - name: Live static data (apps/live/public/data, from .corpus; lexical neighbours)
        # No embedding cache in PR builds: --neighbors auto falls back to the lexical vectors.
        run: npm run data:build --workspace=@emunas/live

      - name: Build Quiet
        run: npm run build --workspace=@emunas/quiet
      - name: Build Live
        run: npm run build --workspace=@emunas/live
      - name: Build Home
        run: npm run build --workspace=@emunas/home
      # Home's public/_headers has no media origin to fill in (its files are same-origin /files/*),
      # so it ships as built.
      - name: Render _headers (media origin into CSP)
        run: |
          npx tsx apps/quiet/worker/render-headers.ts apps/quiet/dist/_headers
          npx tsx apps/live/worker/render-headers.ts apps/live/build/client/_headers
      - name: Validate wrangler configs and bundle the Live and Home Workers (dry run)
        run: |
          (cd apps/quiet && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env="")
          (cd apps/quiet && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env=staging)
          (cd apps/live && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env="" --outdir ../../.wrangler/bundles/live)
          (cd apps/live && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env=staging)
          (cd apps/home && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env="" --outdir ../../.wrangler/bundles/home)
          (cd apps/home && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env=staging)

      - name: Guard self-test (a planted leak must fail)
        run: |
          plant="$(mktemp -d)"
          printf '{"id":"planted","heardAs":"planted"}\n' > "$plant/planted.json"
          if npm run --silent guard --workspace=@emunas/corpus-guard -- post --no-verbatim --scan "$plant"; then
            echo "::error::guard post-pass passed a planted heardAs fixture"
            exit 1
          fi
          echo "guard post-pass rejected the planted fixture, as it must"
      - name: Guard post-pass (all outputs and the Worker bundle)
        run: >-
          npm run guard --workspace=@emunas/corpus-guard --
          post --scan .corpus apps/quiet/dist apps/live/build/client apps/home/dist .wrangler/bundles
          --corpus .corpus --corpus-data data/derived/corpus --report guard-post.json
      - name: Budgets
        run: npm run guard --workspace=@emunas/corpus-guard -- budgets apps/quiet/dist apps/live/build/client apps/home/dist
      - name: Live data budgets (tech-live size targets; over-target is a warning)
        run: npm run data:budgets --workspace=@emunas/live
      - name: Chain self-tests (a planted asrVariants key and a planted ASR synonym must fail guard post)
        # tests/chain/site-chain.ts plants into the built layer, runs guard post, restores the file;
        # --expect-fail-at makes the step pass only when the chain fails exactly at guard post.
        run: |
          for plant in asr-key asr-synonym; do
            npm run --silent site:chain -- --from guard-post --to guard-post --plant "$plant" \
              --expect-fail-at guard-post --report "$RUNNER_TEMP/planted-$plant.json"
          done

      - name: Job summary
        if: always()
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";
          const read = (p) => (existsSync(p) ? JSON.parse(readFileSync(p, "utf8")) : null);
          const build = read(".corpus/build.json");
          const sup = read(".corpus/suppress.json");
          console.log("## Site build");
          if (build) {
            const c = build.counts;
            console.log(`- ${c.full} of ${c.total} shiurim with notes; ${c.catalogOnly} catalog-only; ${c.downgraded} downgraded`);
          }
          if (sup) console.log(`- verbatim: ${sup.suppress.length} suppressed, ${sup.report.length} reported (ids only)`);
          const corpusIds = (sup?.suppress ?? []).map((s) => s.id).filter((id) => id.startsWith("corpus:"));
          if (corpusIds.length) console.log(`- suppressed corpus ids: ${corpusIds.join(", ")}`);
          const guard = read("guard-post.json");
          if (guard) console.log(`- guard post: ${guard.counts.findings} finding(s), ${guard.counts.filesScanned} files, alias terms checked ${guard.counts.aliasTermsChecked}`);
          // Corpus layer counts (corpus-wave-plan §6): visible recounts, pages per site, files not read.
          const layer = read(".corpus/layer/layer.json");
          if (layer?.counts) {
            const c = layer.counts;
            console.log(`- layer: ${c.visibleShiurim} visible shiurim; topics ${c.topics}, concepts ${c.concepts}, people ${c.people}, works ${c.works}, stories ${c.stories}, threads ${c.threads}, series ${c.series}`);
            for (const [site, p] of Object.entries(c.pages ?? {})) console.log(`- ${site} pages: ${Object.entries(p).map(([k, v]) => `${k} ${v}`).join(", ")}`);
            console.log(`- files not read: ${(layer.notRead ?? []).join(", ") || "none"}`);
          }
          JS

      - name: Keep build output for the preview job
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: site-builds
          path: |
            apps/quiet/dist
            apps/live/build/client
            apps/home/dist
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  e2e:
    # W5.1 gates. Builds both sites from the real data/ with the test domain emunas.example (RFC
    # 2606, never resolves): the specs route both hosts to the build outputs and answer the
    # placeholder media host with silent audio, so nothing leaves the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EMUNAS_MEDIA_ORIGIN: https://media.example.invalid
      EMUNAS_DOMAIN: emunas.example
      PW_CHANNEL: chromium
      CHROME_PATH: /usr/bin/google-chrome
      LHCI_VERSION: 0.15.1
      HTML_VALIDATE_VERSION: 11.17.0
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Browsers are cached per Playwright version (saved from main only, like node_modules); the
      # system libraries are apt packages, so install-deps runs either way.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Install Playwright browsers (Chromium, WebKit)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies (browsers restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Save Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
      # html-validate and @lhci/cli run through npx and are not in the lockfile.
      - name: Cache npx packages (html-validate, Lighthouse CI)
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-${{ runner.os }}-html-validate-${{ env.HTML_VALIDATE_VERSION }}-lhci-${{ env.LHCI_VERSION }}

      - name: Corpus, guard pre, suppress rebuild, search rows, Live data, both builds (real data, test domain)
        # The chain's build steps (tests/chain/site-chain.ts), so the browser gates see the same
        # outputs the deploy ships; the build job above runs guard post and the budgets.
        run: npm run site:chain -- --to live-build

      - name: Typecheck and lint the cross-site suite
        run: |
          npx tsc --noEmit -p tests/cross-site/tsconfig.json
          npx eslint --config packages/config/eslint.config.js --max-warnings 0 tests/cross-site

      - name: Live e2e, contract fixtures (Chromium + WebKit, desktop + mobile)
        working-directory: apps/live
        run: npx playwright test -c test/e2e/playwright.matrix.config.ts
      - name: Live e2e, real-data build (@data specs)
        working-directory: apps/live
        env:
          LIVE_E2E_DATA: build
        run: npx playwright test -c test/e2e/playwright.matrix.config.ts --grep @data

      - name: Quiet e2e (Chrome; JS on and off)
        env:
          QUIET_E2E_DIST: ${{ github.workspace }}/apps/quiet/dist
        run: npm run test:e2e --workspace=@emunas/quiet
      - name: Quiet route types in WebKit
        working-directory: apps/quiet
        env:
          QUIET_E2E_DIST: ${{ github.workspace }}/apps/quiet/dist
          QUIET_E2E_BROWSER: webkit
        run: npx vitest run --config vitest.e2e.config.ts test/e2e/routes.test.ts

      - name: Cross-site equivalence (both builds, Chrome)
        run: npx vitest run --config tests/cross-site/vitest.config.ts
      - name: Cross-site link check
        run: npx tsx tests/cross-site/check-links.ts
      - name: Cross-site link check self-test (a planted broken link must fail)
        run: |
          plant="$(mktemp -d)"
          cp -r apps/quiet/dist "$plant/quiet"
          page="$plant/quiet/en/index.html"
          sed -i 's|</main>|<a href="https://listen.emunas.example/en/s/planted-no-such-shiur">x</a></main>|' "$page"
          grep -q planted-no-such-shiur "$page"
          if npx tsx tests/cross-site/check-links.ts --quiet "$plant/quiet"; then
            echo "::error::the cross-site link check passed a planted broken link"
            exit 1
          fi
          echo "the cross-site link check rejected the planted link, as it must"

      - name: html-validate (sample of both builds)
        run: >-
          npx --yes "html-validate@${HTML_VALIDATE_VERSION}" --config tests/cross-site/htmlvalidate.json
          $(npx tsx tests/cross-site/html-sample.ts)

      - name: Search eval regression gate (fail on a drop of more than 5 points)
        # The committed baseline is the stand-in embedder's run; once the real Workers AI report is
        # committed (W3.10, O10), add --embedder workers-ai --r2 with the Cloudflare secrets.
        run: >-
          npx tsx apps/live/tests/eval/run.ts --embedder fake
          --cache "$RUNNER_TEMP/eval-cache" --out "$RUNNER_TEMP/eval"
          --baseline apps/live/tests/eval/report.json

      - name: Lighthouse budgets, Quiet (mobile; perf >= 0.95, LCP < 1.8 s)
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config=tests/cross-site/lighthouse/quiet.lighthouserc.json
      - name: Lighthouse budgets, Live (mobile; LCP <= 2.0 s, TBT <= 200 ms)
        # Not met yet (LCP 3.5–4.9 s on Today, Explore and the listening room with compression; see
        # the W5.1 report). Reported on every run; make it blocking once the Live budgets are met.
        continue-on-error: true
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" autorun --config=tests/cross-site/lighthouse/live.lighthouserc.json

      - name: Keep reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            apps/live/playwright-report
            apps/live/test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

  passed:
    # Records that this exact tree passed check, build and e2e: an artifact named after the git
    # tree id (content only, not the commit). deploy.yml looks it up and skips its typecheck, lint
    # and unit tests for a tree CI already passed; a squash or rebase merge of a PR whose last run
    # tested refs/pull/N/merge against the current main has the same tree. A miss only means the
    # deploy runs those checks again.
    needs: [check, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Tree id
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/ci-passed.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/ci-passed.txt
          retention-days: 30
          if-no-files-found: error

  preview:
    # Same-repo PRs only (fork PRs get no secrets). Uploads a version of each staging Worker
    # with the alias pr-<n>; nothing is promoted, production is never touched (§3.4).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            apps/quiet/wrangler.jsonc
            apps/live/wrangler.jsonc
            apps/live/worker
            apps/home/wrangler.jsonc
            apps/home/worker
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: site-builds
          path: apps
      - name: Upload preview versions (staging Workers)
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not configured; skipping preview upload."
            exit 0
          fi
          for app in quiet live home; do
            (cd "apps/${app}" && npx --yes "wrangler@${WRANGLER_VERSION}" versions upload --env=staging \
              --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER} ${HEAD_SHA:0:12}" \
              | tee "../../preview-${app}.log")
          done
          {
            echo "## Preview"
            grep -h -o 'https://[^ ]*workers\.dev[^ ]*' preview-*.log | sort -u | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
