name: data-sync

# integration-plan §4 / O9: bring the pipeline's data commits onto main.
# Hourly: if DATA_BRANCH has commits main lacks and everything they change (since the merge
# base) is under data/, merge them into main and start deploy.yml. If anything outside data/
# changed, refuse to merge and open (or keep) a pull request instead, for a person to review.
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the deploy is dispatched.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide and report only; do not push, dispatch or open a PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: data-sync
  cancel-in-progress: false

env:
  DATA_BRANCH: ${{ vars.DATA_BRANCH || 'claude/dual-website-concepts-sm99sh' }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Decide (merge data-only commits, otherwise pull request)
        id: decide
        run: |
          git fetch --no-tags origin "+refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
          src="origin/${DATA_BRANCH}"
          ahead="$(git rev-list --count "origin/main..${src}")"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          if [ "$ahead" -eq 0 ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "Nothing new on ${DATA_BRANCH}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Paths changed on the data branch since it last shared history with main.
          git diff --name-only "origin/main...${src}" > "$RUNNER_TEMP/changed.txt"
          grep -v '^data/' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/outside.txt" || true
          total="$(wc -l < "$RUNNER_TEMP/changed.txt")"
          outside="$(wc -l < "$RUNNER_TEMP/outside.txt")"
          {
            echo "## data-sync"
            echo "- ${ahead} commit(s) on ${DATA_BRANCH} not on main; ${total} path(s) changed, ${outside} outside data/"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$outside" -eq 0 ]; then
            echo "action=merge" >> "$GITHUB_OUTPUT"
            echo "- decision: merge into main (data-only)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "action=pr" >> "$GITHUB_OUTPUT"
            {
              echo "- decision: **refused to merge**: changes outside data/ need review (pull request)"
              head -n 50 "$RUNNER_TEMP/outside.txt" | sed 's/^/  - /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge into main
        if: steps.decide.outputs.action == 'merge'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          src="origin/${DATA_BRANCH}"
          if ! git merge --ff-only "$src"; then
            git merge --no-ff --no-edit -m "data-sync: merge data commits from ${DATA_BRANCH}" "$src"
          fi
          # Re-check what the merge brings to main: still data/ only.
          if git diff --name-only "origin/main" HEAD | grep -v '^data/'; then
            echo "::error::merge result changes paths outside data/; not pushing"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push $(git rev-parse --short HEAD) to main and dispatch deploy.yml" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open or keep a pull request
        if: steps.decide.outputs.action == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --head "$DATA_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Pull request #${existing} is already open." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would open a pull request ${DATA_BRANCH} → main" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "data-sync found commits on \`${DATA_BRANCH}\` that change paths outside \`data/\`,"
            echo "so it did not merge them automatically. Review and merge by hand."
            echo
            echo "Paths outside data/ (first 50):"
            echo
            # shellcheck disable=SC2016 # literal backticks for Markdown code spans
            head -n 50 "$RUNNER_TEMP/outside.txt" | sed 's/^/- `/; s/$/`/'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --head "$DATA_BRANCH" --base main \
            --title "data-sync: ${DATA_BRANCH} has changes outside data/" --body-file "$RUNNER_TEMP/body.md"
