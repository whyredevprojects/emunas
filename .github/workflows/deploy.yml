name: deploy

# integration-plan §3.5 and §4 (as amended by A1: no audio bucket, no audio routes):
# typecheck, lint and unit tests (any failure = nothing deploys) → corpus:build → guard pre → corpus:build --suppress → app builds → _headers → Worker bundles
# → guard post (FAIL = nothing deploys) → budgets → D1 migrations → D1/Vectorize sync
# → deploy emunas-api → emunas-quiet → emunas-live → emunas-home → job summary.
# The build and guard steps run in the order of `npm run site:chain` (tests/chain/site-chain.ts);
# tests/chain/site-chain.test.ts fails when this file and the script disagree.
# Production from main (push touching site inputs, dispatch); staging by dispatch only.
# The scheduled Quiet-only rebuild for "this week" is refresh-quiet.yml. See docs/sites/ops-runbook.md.

on:
  push:
    branches: [main]
    paths:
      - "data/derived/**"
      - "data/catalog/**"
      - "apps/**"
      - "packages/**"
      - "workers/**"
      - "site-policy/**"
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [production, staging]
        default: production
      plant_leak_fixture:
        description: "Test only: plant a forbidden-key file in the Quiet output; the guard must stop the deploy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Syncs are hash-diffed and idempotent, so cancelling a stale run is safe.
  group: deploy-${{ inputs.target || 'production' }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.4
  WRANGLER_VERSION: 4.156.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # A first fill of an empty Vectorize index embeds ~58k texts at ~14/s (~70 min); later
    # deploys only embed changed moments. Keep headroom for that first run per index.
    timeout-minutes: 120
    # GitHub environments hold the protection rules and the Cloudflare secrets/variables.
    environment: ${{ inputs.target || 'production' }}
    env:
      TARGET: ${{ inputs.target || 'production' }}
      # wrangler.jsonc: top level = production, env.staging = staging.
      WRANGLER_ENV: ${{ (inputs.target || 'production') == 'staging' && 'staging' || '' }}
      EMUNAS_MEDIA_ORIGIN: ${{ vars.EMUNAS_MEDIA_ORIGIN }}
      # With CI=true (set by Actions) this makes corpus:build fail instead of warn when the media
      # origin would be the dev placeholder https://media.example.invalid.
      EMUNAS_DEPLOY: "1"
      # Site hosts (canonical, hreflang, sitemaps, cross-site links; integration-plan §2.1) and the
      # Quiet "report an error" address. Set EMUNAS_DOMAIN once the domain exists (O8); until then
      # EMUNAS_WORKERS_SUBDOMAIN gives the workers.dev hosts. The Quiet and Home builds fail without them.
      EMUNAS_DOMAIN: ${{ vars.EMUNAS_DOMAIN }}
      EMUNAS_WORKERS_SUBDOMAIN: ${{ vars.EMUNAS_WORKERS_SUBDOMAIN }}
      EMUNAS_STAGE: ${{ (inputs.target || 'production') == 'staging' && 'staging' || '' }}
      EMUNAS_FEEDBACK_EMAIL: ${{ vars.EMUNAS_FEEDBACK_EMAIL }}
      # Live "report a problem" (W4.7): the public Turnstile site key, baked into the Live build by
      # Vite. Without it a non-localhost build hides the report control (a warning below).
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      # "Same idea elsewhere" (W4.4): `auto` uses the real embeddings when the R2 cache can be
      # mirrored, else the lexical fallback; `lexical` skips the mirror. See the ops runbook §4.
      EMUNAS_NEIGHBORS: ${{ vars.EMUNAS_NEIGHBORS || 'auto' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in EMUNAS_MEDIA_ORIGIN EMUNAS_FEEDBACK_EMAIL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::${v} is not set for environment ${TARGET}"; missing=1; fi
          done
          if [ -z "$EMUNAS_DOMAIN" ] && [ -z "$EMUNAS_WORKERS_SUBDOMAIN" ]; then
            echo "::error::neither EMUNAS_DOMAIN nor EMUNAS_WORKERS_SUBDOMAIN is set for environment ${TARGET}"; missing=1
          fi
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::warning::VITE_TURNSTILE_SITE_KEY is not set for environment ${TARGET}; the Live report control will be hidden"
          fi
          case "$EMUNAS_NEIGHBORS" in
            auto|lexical) ;;
            *) echo "::error::EMUNAS_NEIGHBORS must be auto or lexical (got '${EMUNAS_NEIGHBORS}')"; missing=1 ;;
          esac
          exit "$missing"

      # The transcript folder is in git; only the guard steps below read it (from its default path).
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      # The same checks as ci.yml's quality job: a red typecheck, lint or unit test deploys nothing.
      - name: Typecheck (sites, site Workers, eval suite)
        run: npm run site:typecheck
      - name: Lint
        run: npm run site:lint
      - name: Unit tests (sites, site Workers, eval suite)
        run: npm run site:test
      - name: Check emunas-api resources are provisioned
        # wrangler.jsonc ships placeholder D1 ids (00000000-0000-4000-8000-…) until the resources
        # are created (ops-runbook); deploying with them would fail half-way, after the site builds.
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const text = readFileSync("workers/api/wrangler.jsonc", "utf8");
          // Drop // and /* */ comments outside strings, then trailing commas: enough for this file.
          const json = text
            .replace(/"(?:[^"\\]|\\.)*"|\/\/[^\n]*|\/\*[\s\S]*?\*\//g, (m) => (m.startsWith('"') ? m : ""))
            .replace(/,(\s*[}\]])/g, "$1");
          const cfg = JSON.parse(json);
          const env = process.env.WRANGLER_ENV;
          const dbs = (env ? cfg.env?.[env]?.d1_databases : cfg.d1_databases) ?? [];
          const bad = dbs.filter((d) => /^00000000-0000-4000-8000-/.test(d.database_id ?? ""));
          for (const d of bad) console.log(`::error::workers/api/wrangler.jsonc: ${d.binding} (${d.database_name}) still has the placeholder database_id`);
          if (dbs.length === 0) console.log(`::error::workers/api/wrangler.jsonc has no d1_databases for ${env || "production"}`);
          process.exit(bad.length || dbs.length === 0 ? 1 : 0);
          JS

      - name: Restore corpus fingerprints and Astro cache
        uses: actions/cache@v4
        with:
          path: |
            .corpus
            apps/quiet/node_modules/.astro
            apps/home/node_modules/.astro
            node_modules/.astro
          key: site-build-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: site-build-${{ env.TARGET }}-
      - name: Remember previous statuses (for "newly full" in the summary)
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if [ -f .corpus/index.json ]; then cp .corpus/index.json "$RUNNER_TEMP/prev/index.json"; fi

      - name: Corpus build
        run: npm run corpus:build
      - name: Guard pre-pass (verbatim suppress list, ids only)
        run: >-
          npm run guard --workspace=@emunas/corpus-guard --
          pre --corpus .corpus --out .corpus/suppress.json
      - name: Corpus rebuild with suppress list
        run: npm run corpus:build -- --suppress .corpus/suppress.json
      - name: Search documents and moments (.corpus/search, read by Quiet search and search:sync)
        run: npm run search:build

      # "Same idea elsewhere" on real embeddings (W4.4/W3.10). The W3.10 sync and the model eval
      # fill R2 emunas-site-build with emb/<model-slug>/<sha256(text)>.f16; this mirrors the
      # deployed model's prefix (EMBED_MODEL in workers/api/wrangler.jsonc) into .cache/embeddings.
      # Skipped cleanly (lexical neighbours) when EMUNAS_NEIGHBORS=lexical, when the aws CLI or R2
      # credentials are unavailable, or when the prefix is empty. Vectors only, never text.
      - name: Restore embedding cache
        if: env.EMUNAS_NEIGHBORS == 'auto'
        uses: actions/cache@v4
        with:
          path: .cache/embeddings
          key: emb-cache-${{ github.run_id }}
          restore-keys: emb-cache-
      - name: Mirror embedding cache from R2 (emb/<model>/)
        id: emb
        if: env.EMUNAS_NEIGHBORS == 'auto'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EMUNAS_EMBED_BUCKET: ${{ vars.EMUNAS_EMBED_BUCKET || 'emunas-site-build' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          skip() { echo "::notice::embedding neighbours skipped: $1; data:build uses lexical neighbours"; echo "available=false" >> "$GITHUB_OUTPUT"; exit 0; }
          model="$(node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const text = readFileSync("workers/api/wrangler.jsonc", "utf8");
          const json = text
            .replace(/"(?:[^"\\]|\\.)*"|\/\/[^\n]*|\/\*[\s\S]*?\*\//g, (m) => (m.startsWith('"') ? m : ""))
            .replace(/,(\s*[}\]])/g, "$1");
          const cfg = JSON.parse(json);
          const env = process.env.WRANGLER_ENV;
          const vars = (env ? cfg.env?.[env]?.vars : cfg.vars) ?? {};
          process.stdout.write(String(vars.EMBED_MODEL ?? ""));
          JS
          )" || skip "could not read EMBED_MODEL from workers/api/wrangler.jsonc"
          [ -n "$model" ] || skip "no EMBED_MODEL in workers/api/wrangler.jsonc for ${TARGET}"
          # Same slug as modelSlug() in workers/api/sync/src/embed.ts.
          slug="$(printf '%s' "$model" | sed -E 's#^@cf/##; s#/#--#g; s#[^A-Za-z0-9._-]#_#g')"
          command -v aws > /dev/null || skip "the aws CLI is not installed on this runner"
          key_id="$R2_ACCESS_KEY_ID"
          secret="$R2_SECRET_ACCESS_KEY"
          if [ -z "$key_id" ] || [ -z "$secret" ]; then
            # As the sync does (workers/api/sync/src/cloudflare.ts): access key id = the API token's
            # id, secret = sha256(token). User tokens verify at /user, account tokens per account.
            key_id=""
            for path in "user/tokens/verify" "accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify"; do
              key_id="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/${path}" | jq -r '.result.id // empty' 2> /dev/null)" || key_id=""
              [ -n "$key_id" ] && break
            done
            [ -n "$key_id" ] || skip "could not derive R2 credentials from CLOUDFLARE_API_TOKEN"
            secret="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          fi
          echo "::add-mask::${secret}"
          dest=".cache/embeddings/emb/${slug}"
          mkdir -p "$dest"
          if ! AWS_ACCESS_KEY_ID="$key_id" AWS_SECRET_ACCESS_KEY="$secret" AWS_DEFAULT_REGION=auto \
            aws s3 sync --only-show-errors --no-progress \
              --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              "s3://${EMUNAS_EMBED_BUCKET}/emb/${slug}/" "${dest}/"; then
            skip "could not mirror s3://${EMUNAS_EMBED_BUCKET}/emb/${slug}/ (bucket or token scope missing?)"
          fi
          count="$(find "$dest" -name '*.f16' -type f | wc -l)"
          [ "$count" -gt 0 ] || skip "R2 has no vectors under emb/${slug}/ yet (run the W3.10 eval or sync first)"
          echo "mirrored ${count} vectors for ${model}"
          {
            echo "available=true"
            echo "model=${model}"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"
      - name: Live static data (apps/live/public/data, from .corpus)
        env:
          EMB_AVAILABLE: ${{ steps.emb.outputs.available }}
          EMB_MODEL: ${{ steps.emb.outputs.model }}
        run: |
          if [ "$EMB_AVAILABLE" = "true" ]; then
            # Fails loudly if the mirrored cache holds no vector for any moment.
            npm run data:build --workspace=@emunas/live -- \
              --neighbors embeddings --embeddings .cache/embeddings --embed-model "$EMB_MODEL"
          else
            npm run data:build --workspace=@emunas/live -- --neighbors lexical
          fi

      - name: Build Quiet
        run: npm run build --workspace=@emunas/quiet
      - name: Build Live
        run: npm run build --workspace=@emunas/live
      - name: Build Home
        run: npm run build --workspace=@emunas/home
      # Home's public/_headers has no media origin to fill in (its files are same-origin /files/*,
      # served by its Worker from R2), so it ships as built.
      - name: Render _headers (media origin into CSP; fails without it)
        run: |
          npx tsx apps/quiet/worker/render-headers.ts apps/quiet/dist/_headers
          npx tsx apps/live/worker/render-headers.ts apps/live/build/client/_headers
      - name: Bundle Workers for the guard (dry run)
        run: |
          (cd apps/quiet && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env="${WRANGLER_ENV}")
          (cd apps/live && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env="${WRANGLER_ENV}" --outdir ../../.wrangler/bundles/live)
          (cd apps/home && npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --env="${WRANGLER_ENV}" --outdir ../../.wrangler/bundles/home)
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --config workers/api/wrangler.jsonc --env="${WRANGLER_ENV}" --outdir .wrangler/bundles/api

      - name: Plant a leak fixture (dispatch test only)
        if: inputs.plant_leak_fixture
        run: printf '{"id":"planted","heardAs":"planted"}\n' > apps/quiet/dist/planted-leak.json
      - name: Guard post-pass (all outputs and Worker bundles; any finding stops the deploy)
        run: >-
          npm run guard --workspace=@emunas/corpus-guard --
          post --scan .corpus apps/quiet/dist apps/live/build/client apps/home/dist .wrangler/bundles
          --corpus .corpus --corpus-data data/derived/corpus --report "$RUNNER_TEMP/guard-post.json"
      - name: Budgets
        run: npm run guard --workspace=@emunas/corpus-guard -- budgets apps/quiet/dist apps/live/build/client apps/home/dist
      - name: Live data budgets (tech-live size targets; over-target is a warning)
        run: npm run data:budgets --workspace=@emunas/live

      # Search infrastructure (W2.6 / W3.10).
      - name: D1 migrations
        # Both bindings exist in production and env.staging (workers/api/wrangler.jsonc);
        # wrangler resolves each binding's database and migrations_dir for the target env.
        run: |
          for binding in DB_SEARCH DB_FEEDBACK; do
            npx --yes "wrangler@${WRANGLER_VERSION}" d1 migrations apply "${binding}" --remote \
              --config workers/api/wrangler.jsonc --env="${WRANGLER_ENV}"
          done
      - name: D1 and Vectorize incremental sync
        # W3.10: reads .corpus/search/moments.ndjson (search:build above); guards its own uploads.
        run: |
          if node -e 'process.exit(require("./workers/api/package.json").scripts?.["search:sync"] ? 0 : 1)'; then
            npm run search:sync --workspace=@emunas/api -- --env "${TARGET}"
          else
            echo "::notice::@emunas/api has no search:sync script yet; skipping D1/Vectorize sync."
          fi

      - name: Deploy emunas-api
        # Before emunas-live: the Live Worker's service binding API points at it.
        run: >-
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config workers/api/wrangler.jsonc --env="${WRANGLER_ENV}"
          --message "deploy ${GITHUB_SHA:0:12}"
      - name: Deploy emunas-quiet
        working-directory: apps/quiet
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --env="${WRANGLER_ENV}" --message "deploy ${GITHUB_SHA:0:12}"
      - name: Deploy emunas-live
        working-directory: apps/live
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --env="${WRANGLER_ENV}" --message "deploy ${GITHUB_SHA:0:12}"
      - name: Deploy emunas-home
        working-directory: apps/home
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --env="${WRANGLER_ENV}" --message "deploy ${GITHUB_SHA:0:12}"

      - name: Job summary (ids, counts and catalog strings only; never transcript text)
        if: always()
        env:
          PREV_INDEX: ${{ runner.temp }}/prev/index.json
          GUARD_REPORT: ${{ runner.temp }}/guard-post.json
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";
          const read = (p) => (p && existsSync(p) ? JSON.parse(readFileSync(p, "utf8")) : null);
          const build = read(".corpus/build.json");
          const report = read(".corpus/build-report.json");
          const sup = read(".corpus/suppress.json");
          const index = read(".corpus/index.json");
          const prev = read(process.env.PREV_INDEX);
          const guard = read(process.env.GUARD_REPORT);
          const out = [`## Deploy (${process.env.TARGET})`, ""];
          if (!build) out.push("Corpus build did not complete.");
          else {
            const c = build.counts;
            out.push(`**${c.full} of ${c.total}** shiurim with notes · ${c.catalogOnly} catalog-only · ${c.downgraded} downgraded · data ${String(build.dataSha).slice(0, 12)}`);
          }
          if (index && prev) {
            const before = new Map(prev.shiurim.map((s) => [s.id, s.status]));
            const newly = index.shiurim.filter((s) => s.status === "full" && before.get(s.id) !== "full").map((s) => s.id);
            out.push("", `### Newly full (${newly.length})`, ...newly.slice(0, 200).map((id) => `- ${id}`));
          }
          if (report) {
            out.push("", `### Downgraded (${report.downgraded.length})`);
            for (const d of report.downgraded) out.push(`- ${d.id}: ${d.reasons.join("; ")}`);
            const un = report.unmapped ?? {};
            out.push("", "### Unmapped catalog/derived strings");
            for (const [k, rows] of Object.entries(un)) out.push(`- ${k}: ${rows.length}`);
          }
          // Corpus layer counts (corpus-wave-plan §6): visible recounts, pages per site, files not read.
          const layer = read(".corpus/layer/layer.json");
          if (layer?.counts) {
            const c = layer.counts;
            out.push("", "### Corpus layer", `- ${c.visibleShiurim} visible shiurim; topics ${c.topics}, concepts ${c.concepts}, people ${c.people}, works ${c.works}, stories ${c.stories}, threads ${c.threads}, series ${c.series}`);
            for (const [site, p] of Object.entries(c.pages ?? {})) out.push(`- ${site} pages: ${Object.entries(p).map(([k, v]) => `${k} ${v}`).join(", ")}`);
            out.push(`- files not read: ${(layer.notRead ?? []).join(", ") || "none"}`);
            const corpusIds = (sup?.suppress ?? []).map((s) => s.id).filter((id) => id.startsWith("corpus:"));
            out.push(`- suppressed corpus ids: ${corpusIds.join(", ") || "none"}`);
          }
          if (sup) {
            out.push("", `### Verbatim suppressed (${sup.suppress.length}), reported ${sup.report.length}`);
            for (const s of sup.suppress) out.push(`- ${s.id} (${s.runLength} tokens)`);
          }
          if (guard) out.push("", `Guard post-pass: ${guard.counts.findings} finding(s) in ${guard.counts.filesScanned} files, ${guard.counts.verbatimReported} verbatim runs reported`);
          console.log(out.join("\n"));
          JS
