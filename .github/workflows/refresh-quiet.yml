name: refresh-quiet

# Rebuilds and redeploys only the Quiet site from main, so the build-day "this week" window on the
# title page (model.ts thisWeekWindow: build day −1…+3) stays current between content deploys.
# Every second day: one missed or late run is still covered by the window. Pushes to main run the
# full deploy.yml instead. Same corpus build and guard as deploy.yml, scoped to Quiet: no tests
# (main already passed them), no Live, no D1/Vectorize, no emunas-api.
# wrangler uploads only changed assets, so a refresh uploads the few pages that carry the date.

on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shares deploy.yml's group: a full deploy cancels a refresh; a refresh waits for a full deploy.
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.4
  WRANGLER_VERSION: 4.156.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      TARGET: production
      EMUNAS_MEDIA_ORIGIN: ${{ vars.EMUNAS_MEDIA_ORIGIN }}
      EMUNAS_DEPLOY: "1"
      EMUNAS_DOMAIN: ${{ vars.EMUNAS_DOMAIN }}
      EMUNAS_WORKERS_SUBDOMAIN: ${{ vars.EMUNAS_WORKERS_SUBDOMAIN }}
      EMUNAS_STAGE: ""
      EMUNAS_FEEDBACK_EMAIL: ${{ vars.EMUNAS_FEEDBACK_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in EMUNAS_MEDIA_ORIGIN EMUNAS_FEEDBACK_EMAIL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::${v} is not set for environment ${TARGET}"; missing=1; fi
          done
          if [ -z "$EMUNAS_DOMAIN" ] && [ -z "$EMUNAS_WORKERS_SUBDOMAIN" ]; then
            echo "::error::neither EMUNAS_DOMAIN nor EMUNAS_WORKERS_SUBDOMAIN is set for environment ${TARGET}"; missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore corpus fingerprints and Astro cache (read only; deploy.yml saves it)
        uses: actions/cache/restore@v4
        with:
          path: |
            .corpus
            apps/quiet/node_modules/.astro
            node_modules/.astro
          key: site-build-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: site-build-${{ env.TARGET }}-

      - name: Corpus build
        run: npm run corpus:build
      - name: Guard pre-pass (verbatim suppress list, ids only)
        run: >-
          npm run guard --workspace=@emunas/corpus-guard --
          pre --corpus .corpus --out .corpus/suppress.json
      - name: Corpus rebuild with suppress list
        run: npm run corpus:build -- --suppress .corpus/suppress.json
      - name: Search documents (.corpus/search, read by Quiet search)
        run: npm run search:build

      - name: Build Quiet
        run: npm run build --workspace=@emunas/quiet
      - name: Render _headers (media origin into CSP; fails without it)
        run: npx tsx apps/quiet/worker/render-headers.ts apps/quiet/dist/_headers

      - name: Guard post-pass (Quiet output; any finding stops the deploy)
        run: >-
          npm run guard --workspace=@emunas/corpus-guard --
          post --scan .corpus apps/quiet/dist
          --corpus .corpus --corpus-data data/derived/corpus --report "$RUNNER_TEMP/guard-post.json"
      - name: Budgets
        run: npm run guard --workspace=@emunas/corpus-guard -- budgets apps/quiet/dist

      - name: Deploy emunas-quiet
        working-directory: apps/quiet
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "refresh ${GITHUB_SHA:0:12}"

      - name: Job summary
        if: always()
        env:
          GUARD_REPORT: ${{ runner.temp }}/guard-post.json
        run: |
          {
            echo "## Quiet refresh (${TARGET})"
            echo ""
            echo "main at ${GITHUB_SHA:0:12}"
            if [ -f "$GUARD_REPORT" ]; then
              node -e 'const g=require(process.env.GUARD_REPORT); console.log(`Guard post-pass: ${g.counts.findings} finding(s) in ${g.counts.filesScanned} files`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
